<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>soul — topics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/png" href="/soul/soulfavicon.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/soul/soulfavicon_dark.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" sizes="180x180" href="/soul/apple-touch-icon.png">

    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --link: #005bff;

        --mark-light: rgba(255, 241, 118, 0.9);
        --mark-dark: rgba(255, 235, 59, 0.9);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --fg: #ffffff;
          --link: #8fc9ed;
        }
      }

      html, body { height: 100%; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
        padding: 16px;
      }

      @media (hover: hover) and (pointer: fine) {
        body {
          font-size: 12.6px;
        }
      }

      a, a:visited {
        color: var(--link);
        text-decoration: none;
      }

      a:hover { text-decoration: underline; }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      mark {
        background: none;
        color: inherit;
        padding: 0 2px;
        background-image: linear-gradient(
          transparent 62%,
          var(--mark-light) 62%
        );
      }

      @media (prefers-color-scheme: dark) {
        mark {
          background: none;
          padding: 0;
          color: var(--fg);
          text-decoration: underline;
          text-decoration-thickness: 2px;
          text-underline-offset: 0.15em;
          text-decoration-color: var(--mark-dark);
        }
      }

      .counter {
        color: #767676;
        font-size: 0.8em;
      }

      @media (prefers-color-scheme: dark) {
        .counter {
          color: #999;
        }
      }
    
      .cols {
        column-count: 2;
        column-gap: 4ch;
      }

      @media (max-width: 640px) {
        .cols { column-count: 1; }
      }

      .cols .row {
        display: flex;
        justify-content: space-between;
        gap: 2ch;
        break-inside: avoid;
      }
    </style>
  </head>

  <body>
<pre>
<mark>soul</mark> | <a href="index.html">index</a> | <a href="archive.html">archive</a>
↳ en // <a href="https://thesouldevotional.github.io/soul-it/topics.html">it</a>

every topic on the site, with how many entries it holds
<span class="counter">↳ <span id="topics-status">…</span> topics</span>

</pre>
<div id="topics" class="cols" data-fallback="could not load the topic list, see archive.html"><span class="counter">…</span></div>
<pre>

<span class="counter">// <a href="archive.html">back to archive</a></span>
<span class="counter">// <a href="index.html#search-input">search all archives by keyword</a></span>
</pre>
<script>
  (function () {
    var box = document.getElementById("topics");
    var status = document.getElementById("topics-status");

    function esc(s) {
      return s.replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    fetch("archive.html")
      .then(function (r) { return r.text(); })
      .then(function (src) {
        var lines = src.split("\n");
        var header = /^<span id="([a-z0-9-]+)"><\/span>(.+)$/;
        var sub = /^([a-z0-9-]+)-(verses|prayers|versetti|preghiere)$/;
        var topics = [];

        for (var i = 0; i < lines.length; i++) {
          var m = header.exec(lines[i]);
          if (!m) continue;
          var slug = m[1];
          var name = m[2].replace(/<[^>]*>/g, "").trim();
          var count = 0, isTopic = false, closed = false;

          for (var j = i + 1; j < lines.length; j++) {
            var l = lines[j];
            if (l.indexOf('class="top-link"') !== -1) { closed = true; break; }
            var h = header.exec(l);
            if (h) {
              var s = sub.exec(h[1]);
              if (s && s[1] === slug) { isTopic = true; continue; }
              break;
            }
            if (l.indexOf("\u21b3 <a href=\"post.html?p=") === 0) count++;
          }
          if (closed && isTopic) topics.push({ slug: slug, name: name, count: count });
        }

        topics.sort(function (a, b) {
          return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
        });

        box.innerHTML = topics
          .map(function (t) {
            return '<div class="row">\u21b3 <a href="archive.html#' + t.slug + '">' +
              esc(t.name) + '</a> <span class="counter">' + t.count + "</span></div>";
          })
          .join("");
        status.textContent = String(topics.length);
      })
      .catch(function () {
        box.innerHTML = '<span class="counter">' + box.dataset.fallback + "</span>";
      });
  })();
</script>
  </body>
</html>
